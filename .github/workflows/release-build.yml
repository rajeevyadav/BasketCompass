name: release-build
# Heavy build (the downloadable Windows installer) runs ONLY for a release: a
# version tag or a manual dispatch. It never runs on ordinary commits or PRs, so
# no unnecessary build is produced. The quality checks still guard every change
# via pages.yml. The engine/adapter tests gate the build before any installer.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: python3 scripts/CheckCommits.py
        env:
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}

  installer:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tests
        run: npm test
      - name: Build environment
        run: python -m pip install pyinstaller pillow
      - name: Brand assets
        run: python brand/GenerateBrand.py
      - name: Freeze launcher (PyInstaller)
        run: pyinstaller --clean --noconfirm --distpath dist-app --workpath build-work build/BasketCompass.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer (Inno Setup)
        run: iscc build/BasketCompass.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BasketCompass-Windows-installer
          if-no-files-found: error
          path: dist-installer/*.exe
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-installer/*.exe
